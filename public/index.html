<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Cadastro de Alunos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Sistema de Cadastro de Alunos</h1>

    <form id="formAluno">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>

        <label for="curso">Curso:</label>
        <input type="text" id="curso" name="curso" required>

        <button type="submit">Cadastrar aluno</button>

    </form>

    <p id="mensagem" role="status"></p>

    <script>
        const formulario = document.getElementById('formAluno');
        const mensagem = document.getElementById('mensagem');

        formulario.addEventListener('submit', async function (evento) {

            evento.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const curso = document.getElementById('curso').value.trim();

            mensagem.textContent = 'Cadastrando aluno...';
            mensagem.style.color = '#333';

            try {

                const resposta = await fetch('/ALUNOS', {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json'
                    },

                    body: JSON.stringify({
                        nome: nome,
                        email: email,
                        curso: curso
                    })
                });

                const resultado = await resposta.json();

                if (resposta.ok) {

                    mensagem.textContent = 'Aluno cadastrado com sucesso! ID: ' + resultado.id;
                    mensagem.style.color = 'green';

                    formulario.reset();

                } else {

                    mensagem.textContent = resultado.mensagem || 'Erro ao cadastrar aluno.';
                    mensagem.style.color = 'red';

                }

            } catch (erro) {

                console.error('Erro na requisição:', erro);

                mensagem.textContent = 'Não foi possível conectar ao servidor.';
                mensagem.style.color = 'red';

            }

        });
    </script>

</body>

</html>
